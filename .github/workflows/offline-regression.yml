name: Offline regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pydantic==2.13.5 'sqlalchemy[asyncio]==2.0.52' langchain==1.4.0 langchain-core==1.6.2 langgraph==1.2.11 starlette==0.52.1 fastapi==0.141.1 aiosqlite==0.22.1 pypdf==6.16.2 python-docx==1.2.0 langchain-text-splitters==1.1.2 pydantic-settings==2.15.0 python-dotenv==1.2.3 PyJWT==2.15.1 python-multipart==0.0.32 openai==2.54.0

      - name: Run offline regression tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SIGNING_KEY: "offline-test-only-key-never-use-in-production"
          JWT_VERIFYING_KEY: "offline-test-only-key-never-use-in-production"
          JWT_ISSUER: "offline-tests"
          JWT_AUDIENCE: "offline-tests"
        run: |
          python -m unittest discover -s tests -p 'test_checkpoint_flow.py' -v
          python -m unittest discover -s tests -p 'test_memory_update.py' -v
          python -m unittest discover -s tests -p 'test_recall_routing.py' -v
          python -m unittest discover -s tests -p 'test_stream_recovery.py' -v
          python -m unittest discover -s tests -p 'test_chat_workflow.py' -v
          python -m unittest discover -s tests -p 'test_feedback_api.py' -v
          python -m unittest discover -s tests -p 'test_feedback_loop.py' -v
          python -m unittest discover -s tests -p 'test_chat_storage.py' -v
          python -m unittest discover -s tests -p 'test_chat_persistence.py' -v
          python -m unittest discover -s tests -p 'test_chat_api.py' -v
          python -m unittest discover -s tests -p 'test_rag_eval.py' -v
          python -m unittest discover -s tests -p 'test_research_agent.py' -v
          python -m unittest discover -s tests -p 'test_knowledge_*.py' -v
