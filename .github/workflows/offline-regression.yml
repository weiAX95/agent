name: Offline regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pydantic==2.13.5 sqlalchemy==2.0.52 langchain-core==1.6.2 starlette==0.52.1

      - name: Run offline regression tests
        run: |
          python -m unittest discover -s tests -p 'test_checkpoint_flow.py' -v
          python -m unittest discover -s tests -p 'test_memory_update.py' -v
          python -m unittest discover -s tests -p 'test_recall_routing.py' -v
          python -m unittest discover -s tests -p 'test_stream_recovery.py' -v
